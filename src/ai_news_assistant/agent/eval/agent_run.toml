# One agent eval run: what to ask, how many times, and where to write.
experiment = "baseline"          # run folder name: <timestamp>_baseline
split = "dev"                    # test is not enabled yet
dataset = "src/ai_news_assistant/agent/eval/agent_cases.toml"
repeats = 3
workers = 3
out_dir = "data/agent_eval/"
recursion_limit = 25
# Optional, defaults come from the code:
