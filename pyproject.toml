[project]
name = "ai-news-assistant"
version = "0.1.0"
description = "Chatbot agent that answers questions about current AI news"
readme = "README.md"
authors = [
    { name = "efe-onal-2016400267", email = "efeonalll@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.1.0",
    "trafilatura>=2.3.1",
    "transformers>=5.19.0",
]

[project.scripts]
ai-news-assistant = "ai_news_assistant:main"
ai-news-ingest = "ai_news_assistant.ingest:main"
ai-news-extract = "ai_news_assistant.extract:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
